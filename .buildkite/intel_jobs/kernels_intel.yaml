group: Kernels Intel
depends_on: 
  - image-build-xpu
steps:
- label: ":intel: (BMG) vLLM IR Tests"
  key: vllm-ir-tests
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/ir
    - vllm/kernels
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s ir &&
      pytest -v -s kernels/ir'

- label: ":intel: (BMG) UVA Kernel Tests"
  key: uva-kernel-tests
  timeout_in_minutes: 20
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - tests/kernels/core/test_uva.py
    - vllm/utils/torch_utils.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s kernels/core/test_uva.py'

- label: ":intel: (BMG) XPU Sparse MLA Tests"
  key: xpu-sparse-mla-tests
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
    - vllm/v1/attention/backends/mla/xpu_mla_sparse.py
    - tests/kernels/attention/test_xpu_mla_sparse.py
    - tests/v1/attention/test_xpu_mla_sparse_backend.py
    - vllm/model_executor/layers/indexer_topk.py
    - tests/kernels/test_top_k_per_row.py
    - vllm/model_executor/layers/mhc.py
    - tests/kernels/mhc/test_mhc_kernels.py
    - vllm/models/glm5next/
    - vllm/v1/attention/backends/mla/indexer.py
    - tests/models/glm5next/
    - tests/kernels/test_kpool_decode_update_batched.py
    - tests/v1/attention/test_glm5next_indexer_block_sizes.py
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s
      kernels/attention/test_xpu_mla_sparse.py
      v1/attention/test_xpu_mla_sparse_backend.py &&
      pytest -v -s kernels/test_top_k_per_row.py -k sparse_indexer_decode_topk &&
      pytest -v -s kernels/mhc/test_mhc_kernels.py -k xpu_applies_norm &&
      pytest -v -s kernels/test_top_k_per_row.py -k row_starts &&
      pytest -v -s
      models/glm5next/test_kda_recurrent.py
      models/glm5next/test_sparse_indexer_topk_dispatch.py
      kernels/test_kpool_decode_update_batched.py
      v1/attention/test_glm5next_indexer_block_sizes.py'
