group: Models - Language Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Language Models (Hybrid)"
  key: language-models-hybrid
  timeout_in_minutes: 40
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/v1/core/
  - vllm/v1/worker/
  - vllm/v1/attention/backends/mamba1_attn.py
  - vllm/v1/attention/backends/mamba_attn.py
  - vllm/model_executor/layers/mamba/
  - vllm/model_executor/models/jamba.py
  - vllm/model_executor/models/mamba.py
  - vllm/config/cache.py
  - vllm/platforms/xpu.py
  - tests/models/language/generation/test_hybrid.py
  commands:
    - cd tests
    - pytest -v -s models/language/generation/test_hybrid.py -k apc

- label: ":intel: (BMG) Language Models (Pooling)"
  key: language-models-pooling
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  optional: true
  source_file_dependencies:
  - vllm/
  - tests/models/language/pooling
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s models/language/pooling/test_auto_prefix_cache_support.py'

- label: ":intel: (B70) Inkling 2"
  key: inkling2-xpu
  timeout_in_minutes: 60
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/models/inkling2/
  - vllm/models/inkling/nvidia/sconv_swa_attn.py
  - vllm/models/inkling/nvidia/ops/fa4_rel_attention.py
  - vllm/model_executor/layers/fused_moe/
  - vllm/triton_utils/
  - vllm/platforms/xpu.py
  - requirements/xpu.txt
  - tests/models/inkling2/
  commands:
    # The portable Triton kernels, the tiny-model engines and the XPU expert
    # backends; DSpark, LoRA, vision and the CUDA expert GEMMs skip off CUDA.
    - cd tests
    - >-
      pytest -v -s
      models/inkling2/test_core_ops.py
      models/inkling2/test_attention.py
      models/inkling2/test_model.py
      models/inkling2/test_xpu_experts.py
