group: Models - Language Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Language Models (Hybrid)"
  key: language-models-hybrid
  timeout_in_minutes: 40
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/v1/core/
  - vllm/v1/worker/
  - vllm/v1/attention/backends/mamba1_attn.py
  - vllm/v1/attention/backends/mamba_attn.py
  - vllm/model_executor/layers/mamba/
  - vllm/model_executor/models/jamba.py
  - vllm/model_executor/models/mamba.py
  - vllm/config/cache.py
  - vllm/platforms/xpu.py
  - tests/models/language/generation/test_hybrid.py
  commands:
    - cd tests
    - pytest -v -s models/language/generation/test_hybrid.py -k apc

- label: ":intel: (BMG) Language Models (Pooling)"
  key: language-models-pooling
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  optional: true
  source_file_dependencies:
  - vllm/
  - tests/models/language/pooling
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s models/language/pooling/test_auto_prefix_cache_support.py'

- label: ":intel: (B70) Inkling 2"
  key: inkling2-xpu
  # Cold (empty Triton cache, one B70) on development trees: 27-28 min for
  # the first command, with the forced first config (the fixed launch
  # configs); the tuned launches (test_autotune.py) are timed per PR.
  timeout_in_minutes: 50
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
    # The first config of every autotuned launch, i.e. its fixed launch
    # config, without timing; test_autotune.py covers the tuned path.
    VLLM_TRITON_FORCE_FIRST_CONFIG: "1"
  source_file_dependencies:
  - vllm/models/inkling2/
  - vllm/models/inkling/nvidia/sconv_swa_attn.py
  - vllm/models/inkling/nvidia/ops/sconv.py
  - vllm/models/inkling/nvidia/ops/norm.py
  - vllm/models/inkling/nvidia/ops/fa4_rel_attention.py
  - vllm/model_executor/layers/fused_moe/moe_align_block_size.py
  - vllm/model_executor/layers/fused_moe/experts/nvfp4_emulation_moe.py
  - vllm/model_executor/layers/quantization/utils/nvfp4_emulation_utils.py
  - vllm/model_executor/layers/quantization/utils/mxfp8_utils.py
  - vllm/model_executor/layers/fused_moe/fused_moe.py
  - vllm/model_executor/layers/fused_moe/utils.py
  - vllm/_xpu_ops.py
  - vllm/_custom_ops.py
  - vllm/v1/attention/backends/flash_attn.py
  - vllm/v1/core/single_type_kv_cache_manager.py
  - vllm/v1/attention/backend.py
  - vllm/v1/attention/backends/utils.py
  - vllm/v1/kv_cache_interface.py
  - vllm/v1/worker/encoder_cudagraph_defs.py
  - vllm/v1/worker/gpu/spec_decode/dspark/config.py
  - vllm/config/speculative.py
  - vllm/model_executor/warmup/jit_warmup.py
  - vllm/utils/flashinfer.py
  - vllm/utils/platform_utils.py
  - vllm/compilation/breakable_cudagraph.py
  - vllm/triton_utils/
  - vllm/platforms/xpu.py
  - tests/models/inkling2/
  - tests/kernels/moe/test_nvfp4_emulation_moe.py
  - tests/kernels/quantization/nvfp4_utils.py
  commands:
    # The portable Triton kernels, the tiny-model engines, the XPU expert
    # backends and their NVFP4 kernel, and the XPU gates (DSpark, LoRA,
    # image inputs, FP8 KV).
    - cd tests
    - >-
      pytest -v -s
      models/inkling2/test_core_ops.py
      models/inkling2/test_attention.py
      models/inkling2/test_model.py
      models/inkling2/test_xpu_experts.py
      models/inkling2/test_platform_gates.py
      kernels/moe/test_nvfp4_emulation_moe.py
    # The tuned launch path: every config against the reference, and the
    # timing of a fresh key.
    - VLLM_TRITON_FORCE_FIRST_CONFIG=0 pytest -v -s models/inkling2/test_autotune.py
