group: Models - Language Intel
depends_on:
  - image-build-xpu
steps:
- label: ":intel: (BMG) Language Models (Hybrid)"
  key: language-models-hybrid
  timeout_in_minutes: 40
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
  source_file_dependencies:
  - vllm/v1/core/
  - vllm/v1/worker/
  - vllm/v1/attention/backends/mamba_attn.py
  - vllm/model_executor/layers/mamba/
  - vllm/config/cache.py
  - vllm/platforms/xpu.py
  - tests/models/language/generation/test_hybrid.py
  commands:
    - cd tests
    - pytest -v -s models/language/generation/test_hybrid.py -k apc

- label: ":intel: (BMG) Language Models (Pooling)"
  key: language-models-pooling
  timeout_in_minutes: 30
  device: intel_gpu
  agent_tags:
    label: production
    gpu: 1+
    mem: 16+
  no_plugin: true
  working_dir: "."
  env:
    REGISTRY: "public.ecr.aws/q9t5s3a7"
    REPO: "vllm-ci-test-repo"
    VLLM_TEST_DEVICE: "xpu"
  optional: true
  source_file_dependencies:
  - vllm/
  - tests/models/language/pooling
  commands:
    - >-
      bash .buildkite/scripts/hardware_ci/run-intel-test.sh
      'cd tests &&
      pytest -v -s models/language/pooling/test_auto_prefix_cache_support.py'

- label: ":intel: (BMG) Inkling 2"
  key: inkling2-xpu
  # Both commands together take about 27 min cold (empty Triton cache) on
  # one B70.
  timeout_in_minutes: 60
  device: intel_gpu_k8s
  num_devices: 1
  resource_claim_template: b70-1
  working_dir: "/vllm-workspace/"
  env:
    VLLM_TEST_DEVICE: "xpu"
    # The first config of every autotuned launch, i.e. its fixed launch
    # config, without timing; test_autotune.py covers the tuned path.
    VLLM_TRITON_FORCE_FIRST_CONFIG: "1"
  source_file_dependencies:
  - vllm/models/inkling2/
  - vllm/platforms/xpu.py
  - tests/models/inkling2/xpu/
  commands:
    - cd tests
    - >-
      pytest -v -s
      models/inkling2/xpu
      --ignore=models/inkling2/xpu/test_autotune.py
    # The tuned launches as served: timed picks, pruning and the tuning
    # done in the warmup before graph capture.
    - >-
      VLLM_TRITON_FORCE_FIRST_CONFIG=0 pytest -v -s
      models/inkling2/xpu/test_autotune.py
      models/inkling2/xpu/test_model.py::test_graphs_match_eager
